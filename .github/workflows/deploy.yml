name: Deploy

on:
  push:
    branches: [main]
  # Repo metadata (languages, last-pushed dates, stars) is baked in at build
  # time, so a nightly rebuild is what keeps the index honest.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled rebuild race a push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Switches the Pages source to "GitHub Actions" if it's still set to
      # branch-deploy, which is what this repo used before. Without this the
      # deploy step fails until the setting is changed by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - run: npm run build
        env:
          # Lifts the GitHub API rate limit from 60/hr to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
