name: Deploy

on:
  push:
    branches: [main]
  # Repo metadata (languages, last-pushed dates, stars) is baked in at build
  # time, so a nightly rebuild is what keeps the index honest.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled rebuild race a push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Enables Pages if it's switched off entirely. Note it does NOT convert
      # an existing branch-deploy repo to Actions, that needed an explicit
      # `build_type=workflow` on the Pages API (done once, already applied).
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - run: npm ci

      - run: npm run build
        env:
          # Lifts the GitHub API rate limit from 60/hr to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Without this the action tars with `--exclude=.[^/]*`, which drops
          # every dot-entry at the root of the artifact. That silently removes
          # .well-known/ (so security.txt 404s) and .nojekyll.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
