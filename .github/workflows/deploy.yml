name: Deploy

on:
  push:
    branches: [main]
  # Repo metadata (languages, last-pushed dates, stars) is baked in at build
  # time, so a nightly rebuild is what keeps the index honest.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled rebuild race a push. The loser queues rather than
# being killed: cancelling mid-deploy can abort deploy-pages after it has
# created the deployment but before it finishes, which leaves Pages with a
# pending deployment that blocks the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A cache-warm install and a sub-second Astro build. If this is still
    # running after ten minutes something is wedged (npm registry stalls have
    # done it before): fail fast instead of holding the runner for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Enables Pages if it's switched off entirely. Note it does NOT convert
      # an existing branch-deploy repo to Actions, that needed an explicit
      # `build_type=workflow` on the Pages API (done once, already applied).
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # `--prefer-offline` serves every tarball from the setup-node cache and
      # only reaches the network for a genuine miss; `--no-audit`/`--no-fund`
      # drop the two registry calls that were stalling the step for minutes
      # (also set in .npmrc, kept here so the intent is visible at the step).
      - run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run build
        env:
          # Lifts the GitHub API rate limit from 60/hr to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Back the footer's last-played line. Both are kept out of source so
          # the public repo carries no SteamID. If either secret is unset the
          # build still succeeds and the line is simply left out.
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ACCOUNT: ${{ secrets.STEAM_ACCOUNT }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Without this the action tars with `--exclude=.[^/]*`, which drops
          # every dot-entry at the root of the artifact. That silently removes
          # .well-known/ (so security.txt 404s) and .nojekyll.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
