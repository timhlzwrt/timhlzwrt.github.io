name: Set accent

# The friendly way to change src/data/accent.ts: pick a colour in the Run
# workflow form (linked from the internal dashboard), and this writes the
# file, commits it to main and starts a deploy.
on:
  workflow_dispatch:
    inputs:
      colour:
        description: Colour
        type: choice
        default: daily
        options:
          - daily
          - moss
          - teal
          - blue
          - violet
          - plum
          - rose
          - custom
      custom:
        description: 'For "custom": a hex colour like #800020, or a hue from 0 to 359'
        type: string
        required: false

permissions:
  contents: write
  # A push made with GITHUB_TOKEN does not trigger the deploy workflow, a
  # dispatch does.
  actions: write

concurrency:
  group: accent
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always main, whichever ref the run was started from, since that is
      # where the commit goes.
      - uses: actions/checkout@v7
        with:
          ref: main

      # Node 24 runs src/lib/palette.ts as it is, for the check below.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The hues are those of src/lib/palette.ts, so a name lands on its tuned
      # pair. The shape check keeps anything but a number or a hex out of the
      # file; accentChoices then rejects what the build would (a hue of 400)
      # so it fails this run and never reaches main, and prints the pair.
      - name: Write src/data/accent.ts
        env:
          COLOUR: ${{ inputs.colour }}
          CUSTOM: ${{ inputs.custom }}
        run: |
          case "$COLOUR" in
            daily) value='"daily"' ;;
            moss) value=130 ;;
            teal) value=180 ;;
            blue) value=230 ;;
            violet) value=275 ;;
            plum) value=310 ;;
            rose) value=350 ;;
            custom)
              custom="$(echo "$CUSTOM" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
              # A bare number is always a hue, so "400" is an error, not #400.
              if [[ "$custom" =~ ^[0-9]{1,3}$ ]]; then
                value=$((10#$custom))
              elif [[ "$custom" =~ ^#?([0-9a-f]{3}|[0-9a-f]{6})$ ]]; then
                value="\"#${BASH_REMATCH[1]}\""
              else
                echo "::error::Custom must be a hex colour like #800020 or a hue from 0 to 359, got '$CUSTOM'"
                exit 1
              fi ;;
            *) echo "::error::Unknown colour '$COLOUR'"; exit 1 ;;
          esac
          sed -i -E "s/^(export const ACCENT: .* = ).*;$/\1$value;/" src/data/accent.ts
          grep -qE "^export const ACCENT: .* = $value;$" src/data/accent.ts \
            || { echo "::error::Could not find the ACCENT line in src/data/accent.ts"; exit 1; }
          result="$(node --input-type=module -e '
            import { ACCENT } from "./src/data/accent.ts";
            import { accentChoices } from "./src/lib/palette.ts";
            const pairs = accentChoices(ACCENT);
            console.log(pairs.length > 1 ? "daily rotation" : `light ${pairs[0][0]}, dark ${pairs[0][1]}`);
          ')"
          echo "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "value=$value" >> "$GITHUB_ENV"

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Accent is already $value, nothing to change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set the accent to ${value//\"/}"
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
